name: Build and Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/tranloi2k/new-feed-microservices

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api-gateway, auth-service, post-service, comment-service, media-service, notification-service]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}, ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Debug secrets
        run: |
          echo "Host is set: ${{ secrets.VPS_HOST != '' }}"
          echo "Port is set: ${{ secrets.VPS_PORT != '' }}"
          echo "User is set: ${{ secrets.VPS_USER != '' }}"
          echo "Key is set: ${{ secrets.VPS_SSH_KEY != '' }}"
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 169.58.249.13
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd /home/deploy-admin/New-Feed-MicroServices
            export IMAGE_TAG=${{ github.sha }}
            docker compose pull
            docker compose up -d
