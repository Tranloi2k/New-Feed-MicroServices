name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_PREFIX: ghcr.io/tranloi2k/new-feed-microservices

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - post-service
          - comment-service
          - media-service
          - notification-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to K3s
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 15m
          script: |
            set -e
            cd /home/deploy-admin/New-Feed-MicroServices

            echo "==> Pulling latest manifests"
            git pull origin main

            echo "==> Applying manifests"
            kubectl apply -f k8s/

            echo "==> Updating images to ${{ github.sha }}"
            for svc in api-gateway auth-service post-service comment-service media-service notification-service; do
              kubectl set image deployment/$svc \
                $svc=ghcr.io/tranloi2k/new-feed-microservices-$svc:${{ github.sha }} \
                -n newfeed
            done

            echo "==> Waiting for rollout"
            for svc in api-gateway auth-service post-service comment-service media-service notification-service; do
              kubectl rollout status deployment/$svc -n newfeed --timeout=180s
            done

            echo "==> Current state"
            kubectl get pods -n newfeed