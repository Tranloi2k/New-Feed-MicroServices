services:
  # API Gateway
  api-gateway:
    image: ghcr.io/tranloi2k/new-feed-microservices-api-gateway:${IMAGE_TAG:?Set IMAGE_TAG to a full Git commit SHA}
    expose:
      - "8080"
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=8080
      - TRUST_PROXY_HOPS=${TRUST_PROXY_HOPS:-0}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - AUTH_SERVICE_URL=http://auth-service:3001
      - POST_SERVICE_URL=http://post-service:3002
      - MEDIA_SERVICE_URL=http://media-service:3003
      - COMMENT_SERVICE_URL=http://comment-service:3004
      - NOTIFICATION_SERVICE_URL=http://notification-service:3005
      - CHAT_SERVICE_URL=http://chat-service:3006
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER:-newfeed-auth-service}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-newfeed-api-gateway}
      - SERVICE_SECRET=${SERVICE_SECRET}
      - CLIENT_URL=${CLIENT_URL}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
      - auth-service
      - post-service
      - comment-service
      - media-service
      - chat-service
    networks:
      - microservices-network
    restart: unless-stopped

  auth-migrate:
    image: ghcr.io/tranloi2k/new-feed-microservices-auth-service-migrate:${IMAGE_TAG:?Set IMAGE_TAG to a full Git commit SHA}
    environment:
      - NODE_ENV=${NODE_ENV}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-auth:5432/auth_db
      - BCRYPT_ROUNDS=${BCRYPT_ROUNDS:-10}
    depends_on:
      postgres-auth:
        condition: service_healthy
    networks:
      - microservices-network
    restart: "no"

  # Auth Service
  auth-service:
    image: ghcr.io/tranloi2k/new-feed-microservices-auth-service:${IMAGE_TAG:?Set IMAGE_TAG to a full Git commit SHA}
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=3001
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-auth:5432/auth_db
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER:-newfeed-auth-service}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-newfeed-api-gateway}
      - SERVICE_SECRET=${SERVICE_SECRET}
      - CLIENT_URL=${CLIENT_URL}
      - AUTH_COOKIE_DOMAIN=${AUTH_COOKIE_DOMAIN:-}
      - REDIS_URL=redis://redis:6379
      - BCRYPT_ROUNDS=${BCRYPT_ROUNDS:-10}
    depends_on:
      auth-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    networks:
      - microservices-network
    restart: unless-stopped

  # Post Service
  post-service:
    image: ghcr.io/tranloi2k/new-feed-microservices-post-service:${IMAGE_TAG:?Set IMAGE_TAG to a full Git commit SHA}
    ports:
      - "127.0.0.1:3002:3002"
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=3002
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-post:5432/post_db
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      - AUTH_SERVICE_URL=http://auth-service:3001
      - SERVICE_SECRET=${SERVICE_SECRET}
      - CLIENT_URL=${CLIENT_URL}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres-post
      - rabbitmq
      - redis
    networks:
      - microservices-network
    restart: unless-stopped

  # Comment Service
  comment-service:
    image: ghcr.io/tranloi2k/new-feed-microservices-comment-service:${IMAGE_TAG:?Set IMAGE_TAG to a full Git commit SHA}
    ports:
      - "127.0.0.1:3004:3004"
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=3004
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-comment:5432/comment_db
      - AUTH_SERVICE_URL=http://auth-service:3001
      - POST_SERVICE_URL=http://post-service:3002
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      - SERVICE_SECRET=${SERVICE_SECRET}
      - CLIENT_URL=${CLIENT_URL}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres-comment
      - rabbitmq
      - redis
      - post-service
    networks:
      - microservices-network
    restart: unless-stopped

  # Media Service
  media-service:
    image: ghcr.io/tranloi2k/new-feed-microservices-media-service:${IMAGE_TAG:?Set IMAGE_TAG to a full Git commit SHA}
    ports:
      - "127.0.0.1:3003:3003"
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=3003
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - CLIENT_URL=${CLIENT_URL}
    networks:
      - microservices-network
    restart: unless-stopped

  # Notification Service
  notification-service:
    image: ghcr.io/tranloi2k/new-feed-microservices-notification-service:${IMAGE_TAG:?Set IMAGE_TAG to a full Git commit SHA}
    ports:
      - "127.0.0.1:3005:3005"
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=3005
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-notification:5432/notification_db
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      - JWT_SECRET=${JWT_SECRET}
      - SERVICE_SECRET=${SERVICE_SECRET}
      - CLIENT_URL=${CLIENT_URL}
      - AUTH_SERVICE_URL=http://auth-service:3001
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres-notification
      - rabbitmq
      - auth-service
      - redis
    networks:
      - microservices-network
    restart: unless-stopped

  # Chat Service
  chat-migrate:
    image: ghcr.io/tranloi2k/new-feed-microservices-chat-service-migrate:${IMAGE_TAG:?Set IMAGE_TAG to a full Git commit SHA}
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-chat:5432/chat_db
    depends_on:
      postgres-chat:
        condition: service_healthy
    networks:
      - microservices-network
    restart: "no"

  chat-service:
    image: ghcr.io/tranloi2k/new-feed-microservices-chat-service:${IMAGE_TAG:?Set IMAGE_TAG to a full Git commit SHA}
    ports:
      - "127.0.0.1:3006:3006"
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=3006
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-chat:5432/chat_db
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      - AUTH_SERVICE_URL=http://auth-service:3001
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER:-newfeed-auth-service}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-newfeed-api-gateway}
      - SERVICE_SECRET=${SERVICE_SECRET}
      - CLIENT_URL=${CLIENT_URL}
    depends_on:
      chat-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks:
      - microservices-network
    restart: unless-stopped

  # Databases
  postgres-auth:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d auth_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - microservices-network
    restart: unless-stopped

  postgres-post:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: post_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - post-db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    networks:
      - microservices-network
    restart: unless-stopped

  postgres-comment:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: comment_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - comment-db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5435:5432"
    networks:
      - microservices-network
    restart: unless-stopped

  postgres-notification:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - notification-db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5436:5432"
    networks:
      - microservices-network
    restart: unless-stopped

  postgres-chat:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: chat_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - chat-db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5437:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d chat_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - microservices-network
    restart: unless-stopped

  # Redis
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - microservices-network
    restart: unless-stopped

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "127.0.0.1:5673:5672"
      - "127.0.0.1:15673:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - microservices-network
    restart: unless-stopped

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - api-gateway
    networks:
      - microservices-network
    restart: unless-stopped

  # Certbot for SSL certificate renewal
  # certbot:
  #   image: certbot/certbot
  #   volumes:
  #     - ./certbot/conf:/etc/letsencrypt
  #     - ./certbot/www:/var/www/certbot
  #   entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  microservices-network:
    driver: bridge

volumes:
  auth-db-data:
  post-db-data:
  comment-db-data:
  notification-db-data:
  chat-db-data:
  redis-data:
  rabbitmq-data:
