prometheus:
  prometheusSpec:
    retention: 3d
    resources:
      requests:
        memory: 300Mi
      limits:
        memory: 700Mi
        cpu: 500m
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 8Gi

grafana:
  resources:
    requests:
      memory: 96Mi
    limits:
      memory: 200Mi
  sidecar:
    dashboards:
      enabled: true
    resources:
      limits:
        memory: 64Mi
    # tắt sidecar datasource nếu chỉ dùng Prometheus mặc định
  plugins: []

alertmanager:
  enabled: false

prometheusOperator:
  resources:
    limits:
      memory: 256Mi
      cpu: 200m

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true