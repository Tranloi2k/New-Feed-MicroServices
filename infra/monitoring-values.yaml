prometheus:
  prometheusSpec:
    retention: 7d
    resources:
      requests:
        memory: 400Mi
        cpu: 100m
      limits:
        memory: 1Gi
        cpu: 500m
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 8Gi

grafana:
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 384Mi
      cpu: 300m
  persistence:
    enabled: true
    storageClassName: local-path
    size: 2Gi

alertmanager:
  enabled: false

prometheusOperator:
  resources:
    limits:
      memory: 256Mi
      cpu: 200m

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true