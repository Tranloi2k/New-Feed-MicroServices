apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    persistence:
      enabled: true
      size: 128Mi
      storageClass: local-path
      path: /data
    certResolvers:
      letsencrypt:
        email: tranloi162710@gmail.com
        tlsChallenge: true
        httpChallenge:
          entryPoint: web
        storage: /data/acme.json
    deployment:
      initContainers:
        - name: volume-permissions
          image: busybox:1.36
          command:
            - sh
            - -c
            - "touch /data/acme.json && chmod 600 /data/acme.json && chown 65532:65532 /data/acme.json"
          volumeMounts:
            - name: data
              mountPath: /data
    ports:
      web:
        redirectTo:
          port: websecure
          priority: 10
      websecure:
        tls:
          enabled: true