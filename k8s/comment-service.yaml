apiVersion: apps/v1
kind: Deployment
metadata:
  name: comment-service
  namespace: newfeed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: comment-service
  template:
    metadata:
      labels:
        app: comment-service
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      initContainers:
        - name: migrate
          image: ghcr.io/tranloi2k/new-feed-microservices-comment-service:a4aa6d3202a0d8dfa13720682ec95a542ee6d978
          command: ["npx", "prisma", "migrate", "deploy"]
          envFrom:
            - secretRef:
                name: app-secrets
          env:
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres-comment:5432/comment_db
      containers:
        - name: comment-service
          image: ghcr.io/tranloi2k/new-feed-microservices-comment-service:a4aa6d3202a0d8dfa13720682ec95a542ee6d978
          ports:
            - containerPort: 3004
          envFrom:
            - secretRef:
                name: app-secrets
          env:
            - name: PORT
              value: "3004"
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres-comment:5432/comment_db
            - name: RABBITMQ_URL
              value: amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq:5672
            - name: AUTH_SERVICE_URL
              value: http://auth-service:3001
            - name: POST_SERVICE_URL
              value: http://post-service:3002
            - name: REDIS_URL
              value: redis://redis:6379
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              value: ""
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "384Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: comment-service
  namespace: newfeed
spec:
  selector:
    app: comment-service
  ports:
    - port: 3004
      targetPort: 3004