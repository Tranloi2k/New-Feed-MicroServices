apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: newfeed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      initContainers:
        - name: migrate
          image: ghcr.io/tranloi2k/new-feed-microservices-notification-service:f777efb79c6d0e7a6afc7d76c022326f260cbc29
          command: ["npx", "prisma", "migrate", "deploy"]
          envFrom:
            - secretRef:
                name: app-secrets
          env:
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres-notification:5432/notification_db
      containers:
        - name: notification-service
          image: ghcr.io/tranloi2k/new-feed-microservices-notification-service:f777efb79c6d0e7a6afc7d76c022326f260cbc29
          ports:
            - containerPort: 3005
          envFrom:
            - secretRef:
                name: app-secrets
          env:
            - name: PORT
              value: "3005"
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres-notification:5432/notification_db
            - name: RABBITMQ_URL
              value: amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq:5672
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "384Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: newfeed
spec:
  selector:
    app: notification-service
  ports:
    - port: 3005
      targetPort: 3005