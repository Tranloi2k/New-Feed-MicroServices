apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: newfeed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: api-gateway
          image: ghcr.io/tranloi2k/new-feed-microservices-api-gateway:bd272abce5b667d92cb55d19227364c0d7d03661
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: app-secrets
          env:
            - name: PORT
              value: "8080"
            - name: AUTH_SERVICE_URL
              value: http://auth-service:3001
            - name: POST_SERVICE_URL
              value: http://post-service:3002
            - name: MEDIA_SERVICE_URL
              value: http://media-service:3003
            - name: COMMENT_SERVICE_URL
              value: http://comment-service:3004
            - name: NOTIFICATION_SERVICE_URL
              value: http://notification-service:3005
            - name: REDIS_URL
              value: redis://redis:6379
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "384Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: newfeed
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080